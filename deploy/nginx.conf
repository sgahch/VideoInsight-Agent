limit_req_zone $binary_remote_addr zone=videoinsight_login:1m rate=10r/m;
server {
    listen 8000;
    server_name 64.90.27.136;
    server_tokens off;
    client_max_body_size 2048m;
    access_log /opt/videoinsight/access.log;
    error_log /opt/videoinsight/error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    location = /auth/login {
        limit_req zone=videoinsight_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
